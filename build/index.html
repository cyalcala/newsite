<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cyrus Alcala — AI Systems for Service Businesses</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%231c1917'/><text x='50' y='72' font-family='Georgia,serif' font-size='58' font-weight='800' fill='%23f7f3ec' text-anchor='middle'>C</text></svg>">
  <!-- Mobile responsive + menu (all injected via JS to survive bundler head replacement) -->
  <script>
    (function(){
      var isMobile = window.matchMedia('(max-width: 900px)');
      var linkOrigStyles = {};
      var initialized = false;
      var cssInjected = false;
      var origHeaderBF = '';

      function injectCSS() {
        if (cssInjected) return;
        cssInjected = true;
        var s = document.createElement('style');
        s.id = 'mobile-responsive-css';
        s.textContent = [
          '.mobile-menu-toggle{display:none;background:none;border:none;cursor:pointer;padding:12px;min-width:44px;min-height:44px;-webkit-tap-highlight-color:transparent;z-index:60;position:relative;align-items:center;justify-content:center}',
          '.mobile-menu-toggle span{display:block;width:22px;height:2px;background:#1c1917;border-radius:2px;transition:transform .3s cubic-bezier(.2,.7,.2,1),opacity .25s ease}',
          '.mobile-menu-toggle span+span{margin-top:6px}',
          '.mobile-menu-toggle[aria-expanded="true"] span:first-child{transform:translateY(8px) rotate(45deg)}',
          '.mobile-menu-toggle[aria-expanded="true"] span:nth-child(2){opacity:0;transform:scaleX(0)}',
          '.mobile-menu-toggle[aria-expanded="true"] span:last-child{transform:translateY(-8px) rotate(-45deg)}',
          '.skip-link{position:absolute;top:-100%;left:16px;z-index:100;background:#3f43ea;color:#fff;padding:10px 18px;border-radius:0 0 8px 8px;font-weight:600;font-size:14px;text-decoration:none;transition:top .2s}',
          '.skip-link:focus{top:0}',
          'a:focus-visible,button:focus-visible{outline:2px solid #3f43ea;outline-offset:3px;border-radius:4px}',
          '@media(pointer:coarse){a,button{min-height:44px;min-width:44px}}',
          'html{scroll-behavior:smooth}',
          '@keyframes procPulse{0%{left:16%;opacity:0}8%{opacity:1}92%{opacity:1}100%{left:calc(84% - 44px);opacity:0}}@keyframes procNode{0%,100%{border-color:#e5dccb;color:#6f6659;transform:translateY(0);box-shadow:0 10px 24px -12px rgba(60,45,25,.4)}16%,32%{border-color:#3f43ea;color:#3f43ea;transform:translateY(-4px);box-shadow:0 16px 32px -10px rgba(63,67,234,.55)}}.proc-pulse{animation:procPulse 4.2s cubic-bezier(.4,0,.2,1) infinite}.proc-node{animation:procNode 4.2s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.proc-node{animation:none!important;border-color:#3f43ea!important;color:#3f43ea!important}.proc-pulse{display:none!important}}',
          '::selection{background:rgba(63,67,234,.15);color:#1c1917}',
          'img{image-rendering:auto;-webkit-font-smoothing:antialiased}',
          'section{transition:opacity .4s ease}',
          'blockquote{position:relative}',
          '#site-nav{transition:backdrop-filter .3s ease,-webkit-backdrop-filter .3s ease}',
          '#site-nav a{transition:color .2s ease,opacity .2s ease}',
          'h1,h2,h3{text-wrap:balance}p{text-wrap:pretty}',
          'a[href*="calendar.app.google"]{transition:transform .25s cubic-bezier(.2,.7,.2,1),box-shadow .25s ease,filter .25s ease}',
          'a[href*="calendar.app.google"]:hover{transform:translateY(-2px);box-shadow:0 26px 46px -16px rgba(63,67,234,.82);filter:saturate(1.06) brightness(1.02)}',
          'a[href*="calendar.app.google"]:active{transform:translateY(0);transition-duration:.05s}',
          'a[href="#showreel"]{transition:border-color .22s ease,background .22s ease,transform .22s ease}',
          'a[href="#showreel"]:hover{border-color:#1c1917;background:rgba(28,25,23,.035);transform:translateY(-1px)}',
          '#site-nav nav a:not(:last-child){transition:color .2s ease}',
          '#site-nav nav a:not(:last-child):hover{color:#3f43ea}',
          '[style*="aspect-ratio:4/5"] img{transition:transform .6s cubic-bezier(.2,.7,.2,1)}',
          '[style*="aspect-ratio:4/5"]:hover img{transform:scale(1.045)}',
          '.hero-vid{background:#f3ede1}',
          '.hero-vid-toggle{position:absolute;bottom:12px;right:12px;width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:rgba(28,25,23,.5);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);opacity:.72;transition:opacity .25s,background .25s,transform .18s;z-index:3;padding:0}',
          '.hero-vid-toggle:hover{opacity:1;background:rgba(28,25,23,.72)}',
          '.hero-vid-toggle:active{transform:scale(.92)}',
          '.svc-card-1 .svc-icon::before{content:"";position:absolute;top:0;left:0;width:55%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.75),transparent);transform:translateX(-180%) skewX(-16deg);pointer-events:none}',
          '.svc-card-3 .ic-dia::after{content:"";position:absolute;top:0;left:-45%;width:45%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.9),transparent);opacity:0;pointer-events:none}',
          '@keyframes svcPlay{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}@keyframes svcSweep{0%{transform:translateX(-180%) skewX(-16deg)}100%{transform:translateX(320%) skewX(-16deg)}}@keyframes svcHop{0%,100%{transform:translateY(0);filter:brightness(1)}35%{transform:translateY(-3px);filter:brightness(1.6)}}@keyframes svcDiamond{0%{transform:rotate(45deg) scale(1)}50%{transform:rotate(135deg) scale(1.14)}100%{transform:rotate(225deg) scale(1)}}@keyframes svcShine{0%{left:-45%;opacity:0}25%{opacity:1}70%{opacity:1}100%{left:120%;opacity:0}}',
          '@media(hover:hover){.svc-card-1:hover .ic-play{animation:svcPlay 1s ease-in-out infinite}.svc-card-1:hover .svc-icon::before{animation:svcSweep 1.3s ease-in-out infinite}.svc-card-2:hover .svc-icon>span:nth-child(1){animation:svcHop 1.4s ease-in-out infinite}.svc-card-2:hover .svc-icon>span:nth-child(2){animation:svcHop 1.4s ease-in-out infinite .13s}.svc-card-2:hover .svc-icon>span:nth-child(3){animation:svcHop 1.4s ease-in-out infinite .26s}.svc-card-3:hover .ic-dia{animation:svcDiamond 2.1s ease-in-out infinite}.svc-card-3:hover .ic-dia::after{animation:svcShine 2.1s ease-in-out infinite}}',
          '@media(hover:none){.svc-card-1.is-inview .ic-play{animation:svcPlay 1.1s ease-in-out infinite}.svc-card-1.is-inview .svc-icon::before{animation:svcSweep 1.5s ease-in-out infinite}.svc-card-2.is-inview .svc-icon>span:nth-child(1){animation:svcHop 1.5s ease-in-out infinite}.svc-card-2.is-inview .svc-icon>span:nth-child(2){animation:svcHop 1.5s ease-in-out infinite .14s}.svc-card-2.is-inview .svc-icon>span:nth-child(3){animation:svcHop 1.5s ease-in-out infinite .28s}.svc-card-3.is-inview .ic-dia{animation:svcDiamond 2.3s ease-in-out infinite}.svc-card-3.is-inview .ic-dia::after{animation:svcShine 2.3s ease-in-out infinite}}',
          '@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}',
          '@media(max-width:900px){',
            '*{box-sizing:border-box!important}',
            '.mobile-menu-toggle{display:flex;flex-direction:column;gap:0}',
            '#site-nav>div{padding:12px 20px!important;position:relative;z-index:60}',
            '#site-nav>div>a{min-height:44px!important;display:inline-flex!important;align-items:center!important}',
            '#top>div{grid-template-columns:1fr!important;gap:40px!important;padding:48px 20px 40px!important}',
            '#top h1{font-size:clamp(36px,9vw,52px)!important}',
            '#top>div>div:last-child{max-width:340px;margin:0 auto}',
            '#top>div>div:last-child>div:nth-child(2),#top>div>div:last-child>div:nth-child(3){display:none!important}',
            '#top>div>div:first-child>div:nth-child(4){flex-direction:column!important;width:100%}',
            '#top>div>div:first-child>div:nth-child(4) a{width:100%!important;box-sizing:border-box!important;text-align:center!important;justify-content:center!important;display:flex!important}',
            '#build>div>div:last-child{grid-template-columns:1fr!important;gap:16px!important}',
            '#how>div>div:nth-child(3){grid-template-columns:1fr!important;gap:32px!important}',
            '#how>div:nth-child(2)>div{padding:28px 24px!important;flex-direction:column!important;text-align:center!important;gap:16px!important}',
            '#how>div:nth-child(2)>div a{box-sizing:border-box!important;max-width:100%!important}',
            '#proof>div>div:nth-child(4){grid-template-columns:repeat(2,1fr)!important;gap:28px 20px!important}',
            '#proof>div>div:last-child>div:first-child{font-size:12px!important}',
            '#proof>div>div:last-child>div:last-child{font-size:16px!important;gap:10px 24px!important}',
            '#about>div{grid-template-columns:1fr!important;gap:40px!important;padding:60px 20px!important}',
            '#about>div>div:first-child{position:relative!important;top:auto!important;max-width:320px;margin:0 auto}',
            '#writing>div>div:last-child{grid-template-columns:1fr!important;gap:16px!important}',
            '#writing>div>div:last-child>a{min-height:auto!important}',
            '#contact>div:first-child{padding:60px 20px 52px!important}',
            '#contact h2{font-size:clamp(30px,8vw,48px)!important}',
            '#contact>div>div:nth-child(4){flex-direction:column!important}',
            '#contact>div>div:nth-child(4) a{width:100%!important;box-sizing:border-box!important;text-align:center!important;justify-content:center!important;display:flex!important}',
            '#contact>div:last-child>div{flex-direction:column!important;text-align:center!important;gap:8px!important}',
            '#contact>div>div:nth-child(5){flex-wrap:wrap!important;gap:0!important}',
            '#contact>div>div:nth-child(5) a{min-height:44px!important;display:inline-flex!important;align-items:center!important;padding:8px 12px!important}',
            '#writing>div>div:first-child a{min-height:44px!important;display:inline-flex!important;align-items:center!important;padding:8px 0!important}',
            '#build>div>div:last-child span{font-size:12px!important}',
            '#build>div,#how>div,#proof>div,#writing>div{padding-left:20px!important;padding-right:20px!important;padding-top:60px!important;padding-bottom:60px!important}',
            '#build h2,#how h2,#proof h2,#writing h2{font-size:clamp(26px,7vw,38px)!important}.proc-flow{flex-direction:column!important;gap:24px!important;max-width:300px!important;padding:8px 0!important;margin:0 auto 48px!important}.proc-track,.proc-pulse{display:none!important}.proc-step{flex-direction:row!important;align-items:center!important;gap:16px!important}.proc-node{flex-shrink:0!important}.proc-text{margin-top:0!important;text-align:left!important}',
          '}',
          '@media(max-width:480px){',
            '#top h1{font-size:clamp(30px,8.5vw,42px)!important}',
            '#top p{font-size:16px!important}',
            '#proof>div>div:nth-child(4){grid-template-columns:1fr 1fr!important}',
            '#about p{font-size:15px!important}',
          '}',
        ].join('');
        document.head.appendChild(s);
      }

      function toggleMenu(open) {
        var nav = document.querySelector('#site-nav nav');
        var btn = document.querySelector('.mobile-menu-toggle');
        var header = document.querySelector('#site-nav');
        if (!nav || !btn) return;
        btn.setAttribute('aria-expanded', String(open));
        btn.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
        if (header) {
          header.style.backdropFilter = open ? 'none' : origHeaderBF;
          header.style.webkitBackdropFilter = open ? 'none' : origHeaderBF;
          if (open) {
            header.style.position = 'fixed';
            header.style.top = '0';
            header.style.left = '0';
            header.style.right = '0';
            header.style.zIndex = '60';
          } else {
            header.style.position = '';
            header.style.top = '';
            header.style.left = '';
            header.style.right = '';
            header.style.zIndex = '';
          }
        }
        if (open) {
          nav.style.cssText = 'display:flex;position:fixed;top:0;left:0;width:100%;height:100%;background:#f7f3ec;flex-direction:column;justify-content:center;align-items:center;gap:24px;z-index:55;font-size:14px;opacity:1;pointer-events:auto;transition:opacity .35s cubic-bezier(.2,.7,.2,1)';
          nav.classList.add('open');
          document.body.style.overflow = 'hidden';
          var links = nav.querySelectorAll('a');
          links.forEach(function(a, i) {
            if (i === links.length - 1) {
              a.style.cssText = 'font-size:17px;font-weight:600;padding:14px 36px;background:#3f43ea;color:#fff;border-radius:11px;text-decoration:none;margin-top:8px;display:inline-flex;box-shadow:0 10px 22px -12px rgba(63,67,234,.7)';
            } else {
              a.style.cssText = 'font-size:22px;font-weight:600;color:#1c1917;text-decoration:none;padding:12px 0;min-height:44px;display:inline-flex;align-items:center';
            }
          });
        } else {
          nav.style.cssText = 'display:flex;position:fixed;top:0;left:0;width:100%;height:100%;background:#f7f3ec;flex-direction:column;justify-content:center;align-items:center;gap:24px;z-index:55;font-size:14px;opacity:0;pointer-events:none;transition:opacity .35s cubic-bezier(.2,.7,.2,1)';
          nav.classList.remove('open');
          document.body.style.overflow = '';
        }
      }

      function closeAndRestore() {
        var nav = document.querySelector('#site-nav nav');
        if (!nav) return;
        nav.style.cssText = 'display:flex;align-items:center;gap:26px;font-size:14px';
        nav.querySelectorAll('a').forEach(function(a, i) {
          if (linkOrigStyles[i]) a.style.cssText = linkOrigStyles[i];
        });
        nav.classList.remove('open');
        document.body.style.overflow = '';
        var hdr = document.querySelector('#site-nav');
        if (hdr) { hdr.style.backdropFilter = origHeaderBF; hdr.style.webkitBackdropFilter = origHeaderBF; }
        var btn = document.querySelector('.mobile-menu-toggle');
        if (btn) {
          btn.setAttribute('aria-expanded', 'false');
          btn.setAttribute('aria-label', 'Open menu');
        }
      }

      function mountHeroVideo() {
        var slot = document.querySelector('.hero-vid');
        if (!slot) return;
        var wrap = slot.parentElement;
        if (!wrap) return;
        var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        var poster = slot.getAttribute('poster') || 'hero-poster.webp';
        var aria = slot.getAttribute('aria-label') || '';
        var cssText = slot.style.cssText;
        var userPaused = reduce;
        var v = null;
        var PLAY = '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"></path></svg>';
        var PAUSE = '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"></rect><rect x="14" y="5" width="4" height="14" rx="1"></rect></svg>';
        var tgl = document.createElement('button');
        tgl.className = 'hero-vid-toggle';
        tgl.type = 'button';
        function render() {
          if (!v) return;
          var playing = !v.paused;
          tgl.innerHTML = playing ? PAUSE : PLAY;
          tgl.setAttribute('aria-label', playing ? 'Pause background video' : 'Play background video');
        }
        tgl.addEventListener('click', function () {
          if (!v) return;
          if (v.paused) { userPaused = false; v.muted = true; var p = v.play(); if (p && p.catch) p.catch(function () {}); }
          else { userPaused = true; v.pause(); }
          render();
        });
        function build() {
          var nv = document.createElement('video');
          nv.className = 'hero-vid';
          nv.setAttribute('aria-label', aria);
          nv.setAttribute('poster', poster);
          nv.style.cssText = cssText;
          nv.muted = true; nv.loop = true; nv.playsInline = true; nv.preload = 'metadata';
          nv.autoplay = !reduce;
          nv.src = 'showreel-hero.mp4';
          return nv;
        }
        // DC's reconciler removes/pauses foreign nodes in its subtree while it is
        // active at load, then goes idle. Re-mount until our fresh node survives.
        var attempts = 0;
        function mount() {
          attempts++;
          var first = document.querySelector('.hero-vid');
          v = build();
          if (first) first.replaceWith(v); else wrap.insertBefore(v, wrap.firstChild);
          var all = document.querySelectorAll('.hero-vid');
          for (var i = 0; i < all.length; i++) { if (all[i] !== v) all[i].remove(); }
          v.addEventListener('play', render);
          v.addEventListener('pause', render);
          v.addEventListener('ended', function () {
            if (!userPaused) { v.currentTime = 0; var p = v.play(); if (p && p.catch) p.catch(function () {}); }
          });
          if (!tgl.parentElement) wrap.appendChild(tgl);
          if (!reduce) { var pp = v.play(); if (pp && pp.catch) pp.catch(function () {}); }
          render();
          setTimeout(verify, 700);
        }
        function verify() {
          var vids = document.querySelectorAll('.hero-vid');
          var stuck = v && document.contains(v) && vids.length === 1 && vids[0] === v && !v.hasAttribute('data-dc-tpl');
          if (!stuck && attempts < 14) mount();
        }
        mount();
      }

      function enhanceMedia() {
        mountHeroVideo();
        var cards = document.querySelectorAll('.svc-card-1,.svc-card-2,.svc-card-3');
        if (cards.length && 'IntersectionObserver' in window) {
          var io = new IntersectionObserver(function (entries) {
            entries.forEach(function (en) { en.target.classList.toggle('is-inview', en.isIntersecting); });
          }, { threshold: 0.4 });
          cards.forEach(function (c) { io.observe(c); });
        }
      }

      function setup() {
        var nav = document.querySelector('#site-nav nav');
        var header = document.querySelector('#site-nav > div');
        if (!nav || !header || initialized) return;
        initialized = true;
        injectCSS();
        enhanceMedia();

        nav.querySelectorAll('a').forEach(function(a, i) {
          linkOrigStyles[i] = a.getAttribute('style') || '';
        });

        var hdrEl = document.querySelector('#site-nav');
        if (hdrEl) origHeaderBF = hdrEl.style.backdropFilter || '';

        if (!document.querySelector('.mobile-menu-toggle')) {
          var btn = document.createElement('button');
          btn.className = 'mobile-menu-toggle';
          btn.setAttribute('aria-label', 'Open menu');
          btn.setAttribute('aria-expanded', 'false');
          btn.innerHTML = '<span></span><span></span><span></span>';
          header.appendChild(btn);
        }

        if (!document.querySelector('.skip-link')) {
          var skip = document.createElement('a');
          skip.href = '#top';
          skip.className = 'skip-link';
          skip.textContent = 'Skip to content';
          document.body.insertBefore(skip, document.body.firstChild);
        }

        if (isMobile.matches) {
          var hdr = document.querySelector('#site-nav');
          if (hdr) { hdr.style.backdropFilter = 'none'; hdr.style.webkitBackdropFilter = 'none'; }
          nav.style.cssText = 'display:flex;position:fixed;top:0;left:0;width:100%;height:100%;background:#f7f3ec;flex-direction:column;justify-content:center;align-items:center;gap:24px;z-index:55;font-size:14px;opacity:0;pointer-events:none;transition:opacity .35s cubic-bezier(.2,.7,.2,1)';
        }
      }

      document.addEventListener('click', function(e) {
        var samp = e.target.closest('.samp-item');
        if (samp) {
          var sec = samp.closest('.samp-sec');
          var sv = sec.querySelector('.samp-vid');
          var sf = sec.querySelector('.samp-frame');
          var all = sec.querySelectorAll('.samp-item');
          for (var i = 0; i < all.length; i++) { all[i].classList.remove('is-active'); all[i].removeAttribute('aria-current'); }
          samp.classList.add('is-active');
          samp.setAttribute('aria-current', 'true');
          sv.pause();
          sv.removeAttribute('controls');
          sf.classList.remove('is-playing');
          sv.poster = samp.getAttribute('data-poster');
          sv.src = samp.getAttribute('data-src');
          sv.load();
          sec.querySelector('.samp-title').textContent = samp.getAttribute('data-title');
          sec.querySelector('.samp-desc').textContent = samp.getAttribute('data-desc');
          sec.querySelector('.samp-best').textContent = samp.getAttribute('data-best');
          return;
        }
        var splay = e.target.closest('.samp-play');
        if (splay) {
          var sfr = splay.closest('.samp-frame');
          var svid = sfr && sfr.querySelector('.samp-vid');
          if (svid) {
            sfr.classList.add('is-playing');
            svid.setAttribute('controls', '');
            var spp = svid.play();
            if (spp && spp.catch) spp.catch(function () {});
          }
          return;
        }
        var play = e.target.closest('.reel-play');
        if (play) {
          var frame = play.closest('.reel-frame');
          var rv = frame && frame.querySelector('.reel-vid');
          if (rv) {
            frame.classList.add('is-playing');
            rv.setAttribute('controls', '');
            var rp = rv.play();
            if (rp && rp.catch) rp.catch(function () {});
          }
          return;
        }
        var btn = e.target.closest('.mobile-menu-toggle');
        if (btn) {
          var expanded = btn.getAttribute('aria-expanded') === 'true';
          toggleMenu(!expanded);
          return;
        }
        if (isMobile.matches && e.target.closest('#site-nav nav a')) {
          toggleMenu(false);
        }
      }, true);

      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
          var nav = document.querySelector('#site-nav nav');
          if (nav && nav.classList.contains('open')) {
            toggleMenu(false);
            var btn = document.querySelector('.mobile-menu-toggle');
            if (btn) btn.focus();
          }
        }
      });

      isMobile.addEventListener('change', function(e) {
        if (!e.matches) closeAndRestore();
      });

      var poll = setInterval(function() {
        if (document.querySelector('#site-nav nav')) {
          clearInterval(poll);
          setup();
        }
      }, 80);
    })();
  </script>

  <style>

    }

    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }

;margin:auto;width:76px;height:76px;border-radius:50%;background:var(--accent,#3f43ea);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 18px 44px -14px rgba(63,67,234,.7);transition:transform .28s cubic-bezier(.2,.7,.2,1),opacity .28s ease}\n.reel-play:hover{transform:scale(1.08)}\n.reel-play-tri{width:0;height:0;border-style:solid;border-width:12px 0 12px 20px;border-color:transparent transparent transparent #fff;margin-left:5px}\n.reel-frame.is-playing .reel-play{opacity:0;pointer-events:none;transform:scale(.82)}\n.reel-foot{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-top:18px;flex-wrap:wrap}\n.reel-note,.reel-link{font-family:'JetBrains Mono',monospace;font-size:12px}\n.reel-note{color:#6b6155}\n.reel-link{color:#645b4f;text-decoration:none;border-bottom:1px solid #e5dccb;padding-bottom:2px;transition:color .2s,border-color .2s}\n.reel-link:hover{color:#3f43ea;border-color:#3f43ea}\n\n/* ---------- Services: editorial rows, no cards ---------- */\n.build-wrap{max-width:1140px;margin:0 auto;padding:0 32px}\n.sec-head{margin-bottom:26px}\n.svc-list{border-top:1px solid #e5dccb}\n.svc-row{display:grid;grid-template-columns:74px minmax(0,1fr) minmax(210px,300px);gap:30px;align-items:start;padding:42px 0 40px;border-bottom:1px solid #e5dccb;position:relative;transition:background .35s ease}\n.svc-row::before{content:'';position:absolute;left:-24px;top:0;bottom:0;width:2px;background:var(--accent,#3f43ea);transform:scaleY(0);transform-origin:top;transition:transform .4s cubic-bezier(.2,.7,.2,1)}\n.svc-row:hover::before{transform:scaleY(1)}\n.svc-row:hover{background:rgba(63,67,234,.022)}\n.svc-num{font-family:'JetBrains Mono',monospace;font-size:13px;color:#6f6659;padding-top:6px;letter-spacing:.06em;transition:color .3s ease}\n.svc-row:hover .svc-num{color:#3f43ea}\n.svc-title{display:flex;align-items:center;gap:14px;margin-bottom:12px}\n.svc-icon{width:44px;height:44px;border-radius:12px
