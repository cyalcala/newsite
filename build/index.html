<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cyrus Alcala — AI Builds: Video, Workflow &amp; Consulting</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%231c1917'/><text x='50' y='72' font-family='Georgia,serif' font-size='58' font-weight='800' fill='%23f7f3ec' text-anchor='middle'>C</text></svg>">
  <!-- Mobile responsive + menu (all injected via JS to survive bundler head replacement) -->
  <script>
    (function(){
      var isMobile = window.matchMedia('(max-width: 768px)');
      var linkOrigStyles = {};
      var initialized = false;
      var cssInjected = false;
      var origHeaderBF = '';

      function injectCSS() {
        if (cssInjected) return;
        cssInjected = true;
        var s = document.createElement('style');
        s.id = 'mobile-responsive-css';
        s.textContent = [
          '.mobile-menu-toggle{display:none;background:none;border:none;cursor:pointer;padding:8px;-webkit-tap-highlight-color:transparent;z-index:60;position:relative}',
          '.mobile-menu-toggle span{display:block;width:22px;height:2px;background:#1c1917;border-radius:2px;transition:transform .3s cubic-bezier(.2,.7,.2,1),opacity .25s ease}',
          '.mobile-menu-toggle span+span{margin-top:6px}',
          '.mobile-menu-toggle[aria-expanded="true"] span:first-child{transform:translateY(8px) rotate(45deg)}',
          '.mobile-menu-toggle[aria-expanded="true"] span:nth-child(2){opacity:0;transform:scaleX(0)}',
          '.mobile-menu-toggle[aria-expanded="true"] span:last-child{transform:translateY(-8px) rotate(-45deg)}',
          '.skip-link{position:absolute;top:-100%;left:16px;z-index:100;background:#3f43ea;color:#fff;padding:10px 18px;border-radius:0 0 8px 8px;font-weight:600;font-size:14px;text-decoration:none;transition:top .2s}',
          '.skip-link:focus{top:0}',
          'a:focus-visible,button:focus-visible{outline:2px solid #3f43ea;outline-offset:3px;border-radius:4px}',
          '@media(pointer:coarse){a,button{min-height:44px;min-width:44px}}',
          '@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}',
          '@media(max-width:768px){',
            '.mobile-menu-toggle{display:flex;flex-direction:column;gap:0}',
            '#site-nav>div{padding:12px 20px!important;position:relative;z-index:60}',
            '#top>div{grid-template-columns:1fr!important;gap:40px!important;padding:48px 20px 40px!important}',
            '#top h1{font-size:clamp(36px,9vw,52px)!important}',
            '#top>div>div:last-child{max-width:340px;margin:0 auto}',
            '#top>div>div:last-child>div:nth-child(2),#top>div>div:last-child>div:nth-child(3){display:none!important}',
            '#build>div>div:last-child{grid-template-columns:1fr!important;gap:16px!important}',
            '#how>div>div:nth-child(3){grid-template-columns:1fr!important;gap:32px!important}',
            '#how>div:nth-child(2)>div{padding:28px 24px!important;flex-direction:column!important;text-align:center!important;gap:16px!important}',
            '#proof>div>div:nth-child(4){grid-template-columns:repeat(2,1fr)!important;gap:28px 20px!important}',
            '#proof>div>div:last-child>div:last-child{font-size:16px!important;gap:10px 24px!important}',
            '#about>div{grid-template-columns:1fr!important;gap:40px!important;padding:60px 20px!important}',
            '#about>div>div:first-child{position:relative!important;top:auto!important;max-width:320px;margin:0 auto}',
            '#writing>div>div:last-child{grid-template-columns:1fr!important;gap:16px!important}',
            '#writing>div>div:last-child>a{min-height:auto!important}',
            '#contact>div:first-child{padding:60px 20px 52px!important}',
            '#contact h2{font-size:clamp(30px,8vw,48px)!important}',
            '#contact>div:last-child>div{flex-direction:column!important;text-align:center!important;gap:8px!important}',
            '#build>div,#how>div,#proof>div,#writing>div{padding-left:20px!important;padding-right:20px!important;padding-top:60px!important;padding-bottom:60px!important}',
            '#build h2,#how h2,#proof h2,#writing h2{font-size:clamp(26px,7vw,38px)!important}',
          '}',
          '@media(max-width:480px){',
            '#top h1{font-size:clamp(30px,8.5vw,42px)!important}',
            '#top p{font-size:16px!important}',
            '#top>div>div:first-child>div:nth-child(4){flex-direction:column!important;width:100%}',
            '#top>div>div:first-child>div:nth-child(4) a{width:100%!important;text-align:center!important;justify-content:center!important}',
            '#contact>div>div:nth-child(4){flex-direction:column!important}',
            '#contact>div>div:nth-child(4) a{width:100%!important;text-align:center!important;justify-content:center!important}',
            '#proof>div>div:nth-child(4){grid-template-columns:1fr 1fr!important}',
            '#about p{font-size:15px!important}',
          '}',
        ].join('');
        document.head.appendChild(s);
      }

      function toggleMenu(open) {
        var nav = document.querySelector('#site-nav nav');
        var btn = document.querySelector('.mobile-menu-toggle');
        var header = document.querySelector('#site-nav');
        if (!nav || !btn) return;
        btn.setAttribute('aria-expanded', String(open));
        btn.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
        if (header) {
          header.style.backdropFilter = open ? 'none' : origHeaderBF;
          header.style.webkitBackdropFilter = open ? 'none' : origHeaderBF;
          if (open) {
            header.style.position = 'fixed';
            header.style.top = '0';
            header.style.left = '0';
            header.style.right = '0';
            header.style.zIndex = '60';
          } else {
            header.style.position = '';
            header.style.top = '';
            header.style.left = '';
            header.style.right = '';
            header.style.zIndex = '';
          }
        }
        if (open) {
          nav.style.cssText = 'display:flex;position:fixed;top:0;left:0;width:100%;height:100%;background:#f7f3ec;flex-direction:column;justify-content:center;align-items:center;gap:24px;z-index:55;font-size:14px;opacity:1;pointer-events:auto;transition:opacity .35s cubic-bezier(.2,.7,.2,1)';
          nav.classList.add('open');
          document.body.style.overflow = 'hidden';
          var links = nav.querySelectorAll('a');
          links.forEach(function(a, i) {
            if (i === links.length - 1) {
              a.style.cssText = 'font-size:17px;font-weight:600;padding:14px 36px;background:#3f43ea;color:#fff;border-radius:11px;text-decoration:none;margin-top:8px;display:inline-flex;box-shadow:0 10px 22px -12px rgba(63,67,234,.7)';
            } else {
              a.style.cssText = 'font-size:22px;font-weight:600;color:#1c1917;text-decoration:none;padding:8px 0';
            }
          });
        } else {
          nav.style.cssText = 'display:flex;position:fixed;top:0;left:0;width:100%;height:100%;background:#f7f3ec;flex-direction:column;justify-content:center;align-items:center;gap:24px;z-index:55;font-size:14px;opacity:0;pointer-events:none;transition:opacity .35s cubic-bezier(.2,.7,.2,1)';
          nav.classList.remove('open');
          document.body.style.overflow = '';
        }
      }

      function closeAndRestore() {
        var nav = document.querySelector('#site-nav nav');
        if (!nav) return;
        nav.style.cssText = 'display:flex;align-items:center;gap:26px;font-size:14px';
        nav.querySelectorAll('a').forEach(function(a, i) {
          if (linkOrigStyles[i]) a.style.cssText = linkOrigStyles[i];
        });
        nav.classList.remove('open');
        document.body.style.overflow = '';
        var hdr = document.querySelector('#site-nav');
        if (hdr) { hdr.style.backdropFilter = origHeaderBF; hdr.style.webkitBackdropFilter = origHeaderBF; }
        var btn = document.querySelector('.mobile-menu-toggle');
        if (btn) {
          btn.setAttribute('aria-expanded', 'false');
          btn.setAttribute('aria-label', 'Open menu');
        }
      }

      function setup() {
        var nav = document.querySelector('#site-nav nav');
        var header = document.querySelector('#site-nav > div');
        if (!nav || !header || initialized) return;
        initialized = true;
        injectCSS();

        nav.querySelectorAll('a').forEach(function(a, i) {
          linkOrigStyles[i] = a.getAttribute('style') || '';
        });

        var hdrEl = document.querySelector('#site-nav');
        if (hdrEl) origHeaderBF = hdrEl.style.backdropFilter || '';

        if (!document.querySelector('.mobile-menu-toggle')) {
          var btn = document.createElement('button');
          btn.className = 'mobile-menu-toggle';
          btn.setAttribute('aria-label', 'Open menu');
          btn.setAttribute('aria-expanded', 'false');
          btn.innerHTML = '<span></span><span></span><span></span>';
          header.appendChild(btn);
        }

        if (!document.querySelector('.skip-link')) {
          var skip = document.createElement('a');
          skip.href = '#top';
          skip.className = 'skip-link';
          skip.textContent = 'Skip to content';
          document.body.insertBefore(skip, document.body.firstChild);
        }

        if (isMobile.matches) {
          var hdr = document.querySelector('#site-nav');
          if (hdr) { hdr.style.backdropFilter = 'none'; hdr.style.webkitBackdropFilter = 'none'; }
          nav.style.cssText = 'display:flex;position:fixed;top:0;left:0;width:100%;height:100%;background:#f7f3ec;flex-direction:column;justify-content:center;align-items:center;gap:24px;z-index:55;font-size:14px;opacity:0;pointer-events:none;transition:opacity .35s cubic-bezier(.2,.7,.2,1)';
        }
      }

      document.addEventListener('click', function(e) {
        var btn = e.target.closest('.mobile-menu-toggle');
        if (btn) {
          var expanded = btn.getAttribute('aria-expanded') === 'true';
          toggleMenu(!expanded);
          return;
        }
        if (isMobile.matches && e.target.closest('#site-nav nav a')) {
          toggleMenu(false);
        }
      }, true);

      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
          var nav = document.querySelector('#site-nav nav');
          if (nav && nav.classList.contains('open')) {
            toggleMenu(false);
            var btn = document.querySelector('.mobile-menu-toggle');
            if (btn) btn.focus();
          }
        }
      });

      isMobile.addEventListener('change', function(e) {
        if (!e.matches) closeAndRestore();
      });

      var poll = setInterval(function() {
        if (document.querySelector('#site-nav nav')) {
          clearInterval(poll);
          setup();
        }
      }, 80);
    })();
  </script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #faf9f5; display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    #__bundler_loading { position: fixed; bottom: 20px; right: 20px; font: 13px/1.4 -apple-system, BlinkMacSystemFont, sans-serif; color: #666; background: #fff; padding: 8px 14px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.12); z-index: 10000; }
    #__bundler_thumbnail { position: fixed; inset: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #faf9f5; z-index: 9999; }
    #__bundler_thumbnail svg { width: 100%; height: 100%; object-fit: contain; }
    #__bundler_placeholder { color: #999; font-size: 14px; }
  </style>
  <noscript>
    <style>#__bundler_loading { display: none; }</style>
    <div style="position:fixed;bottom:12px;left:12px;font:13px/1.4 -apple-system,BlinkMacSystemFont,sans-serif;color:#999;background:rgba(255,255,255,0.9);padding:6px 12px;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,0.08);z-index:10000;">
      This page requires JavaScript to display.
    </div>
  </noscript>
</head>
<body>
  <div id="__bundler_thumbnail"><svg xmlns="http://www.w3.org/2000/svg" sc-camel-view-box="0 0 100 100"><rect width="100" height="100" fill="#3f43ea"></rect><text x="50" y="70" font-family="Georgia,serif" font-size="56" font-weight="800" fill="#ffffff" text-anchor="middle">C</text></svg></div>
  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];

:1.2;margin:0;flex:1\">What 200+ support guides taught me about prompting<\u002Fh3>\n        <span style=\"font-size:14px;font-weight:600;color:var(--accent,#3f43ea)\">Read the note →<\u002Fspan>\n      <\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n<\u002Fsc-if>\n\n<section id=\"contact\" style=\"scroll-margin-top:72px;border-top:1px solid #ece4d5;background:#1c1917;color:#f7f3ec\">\n  <div style=\"max-width:1140px;margin:0 auto;padding:90px 32px 76px\">\n    <div data-reveal=\"\" style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.16em;color:#d98a63;font-weight:500;margin-bottom:16px\">LET'S BUILD<\u002Fdiv>\n    <h2 data-reveal=\"\" data-reveal-delay=\"60\" style=\"font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:clamp(34px,5vw,66px);line-height:1;letter-spacing:-.03em;margin:0 0 22px;max-width:16ch\">Let's build your AI system.<\u002Fh2>\n    <p data-reveal=\"\" data-reveal-delay=\"100\" style=\"font-size:19px;line-height:1.55;color:#c9c2b6;margin:0 0 38px;max-width:52ch\">Free 30-minute audit. If there's a fit, we start a pilot this week — and you see it work before you pay.<\u002Fp>\n    <div data-reveal=\"\" data-reveal-delay=\"140\" style=\"display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-bottom:52px\">\n      <a href=\"https://calendar.app.google/88HioTVkXmkd6C9D9\" target=\"_blank\" rel=\"noopener\" style=\"background:var(--accent,#3f43ea);color:#fff;font-weight:600;font-size:16px;padding:16px 28px;border-radius:11px;text-decoration:none;display:inline-flex;align-items:center;gap:9px;box-shadow:0 16px 34px -14px rgba(63,67,234,.7)\" style-hover=\"transform:translateY(-2px)\">Book a 30-min call <span style=\"font-family:'JetBrains Mono',monospace\">→<\u002Fspan><\u002Fa>\n      <a href=\"mailto:cyrusalcala@live.com\" style=\"background:transparent;color:#f7f3ec;border:1px solid #45403a;font-weight:600;font-size:16px;padding:15px 26px;border-radius:11px;text-decoration:none\" style-hover=\"border-color:#f7f3ec\">cyrusalcala@live.com<\u002Fa>\n    <\u002Fdiv>\n    <div data-reveal=\"\" style=\"display:flex;gap:12px 30px;flex-wrap:wrap;border-top:1px solid #35302a;padding-top:30px;font-family:'JetBrains Mono',monospace;font-size:13px\">\n      <a href=\"https://www.linkedin.com/in/cyrusalcala\" target=\"_blank\" rel=\"noopener\" style=\"color:#c9c2b6;text-decoration:none\" style-hover=\"color:#fff\">LinkedIn ↗<\u002Fa>\n      <a href=\"https://github.com/cyalcala\" target=\"_blank\" rel=\"noopener\" style=\"color:#c9c2b6;text-decoration:none\" style-hover=\"color:#fff\">GitHub ↗<\u002Fa>\n      <a href=\"assets/Cyrus-Alcala-Resume.docx\" download=\"\" style=\"color:#c9c2b6;text-decoration:none\" style-hover=\"color:#fff\">Résumé ↓<\u002Fa>\n      <span style=\"color:#8a8175\">Manila, Philippines · +63 969 482 0607<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"border-top:1px solid #35302a\">\n    <div style=\"max-width:1140px;margin:0 auto;padding:24px 32px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;font-size:13px;color:#8a8175\">\n      <span style=\"font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:15px;color:#c9c2b6\">Cyrus Alcala<\u002Fspan>\n      <span>© 2026 Cyrus Alcala · The go-to person for AI builds<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1180,&quot;height&quot;:900},&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#3f43ea&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;#3f43ea&quot;,&quot;#1c1917&quot;,&quot;#b8623d&quot;,&quot;#2f7d5b&quot;,&quot;#c2410c&quot;],&quot;section&quot;:&quot;Theme&quot;},&quot;showWriting&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Sections&quot;},&quot;showPilotBanner&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Sections&quot;}}\">\nclass Component extends DCLogic {\n  componentDidMount() {\n    const root = document.getElementById('site-root');\n    if (root) root.style.setProperty('--accent', this.props.accent || '#3f43ea');\n\n    const reveal = () => {\n      const els = Array.from(document.querySelectorAll('[data-reveal]'));\n      els.forEach(el => {\n        el.style.opacity = '0';\n        el.style.transform = 'translateY(22px)';\n        el.style.transition = 'opacity .7s cubic-bezier(.2,.7,.2,1), transform .7s cubic-bezier(.2,.7,.2,1)';\n        const d = el.getAttribute('data-reveal-delay');\n        if (d) el.style.transitionDelay = d + 'ms';\n      });\n      const io = new IntersectionObserver((entries) => {\n        entries.forEach(e => {\n          if (e.isIntersecting) {\n            e.target.style.opacity = '1';\n            e.target.style.transform = 'none';\n            io.unobserve(e.target);\n          }\n        });\n      }, { threshold: 0.12, rootMargin: '0px 0px -6% 0px' });\n      els.forEach(el => io.observe(el));\n    };\n    requestAnimationFrame(reveal);\n\n    const nav = document.getElementById('site-nav');\n    const onScroll = () => {\n      if (!nav) return;\n      if (window.scrollY > 8) {\n        nav.style.boxShadow = '0 10px 34px -20px rgba(60,45,25,.55)';\n        nav.style.background = 'rgba(247,243,236,.93)';\n      } else {\n        nav.style.boxShadow = 'none';\n        nav.style.background = 'rgba(247,243,236,.82)';\n      }\n    };\n    window.addEventListener('scroll', onScroll, { passive: true });\n    onScroll();\n    this._onScroll = onScroll;\n  }\n  componentDidUpdate() {\n    const root = document.getElementById('site-root');\n    if (root) root.style.setProperty('--accent', this.props.accent || '#3f43ea');\n  }\n  componentWillUnmount() {\n    if (this._onScroll) window.removeEventListener('scroll', this._onScroll);\n  }\n  renderVals() {\n    return {\n      showWriting: this.props.showWriting ?? true,\n      showPilotBanner: this.props.showPilotBanner ?? true,\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
